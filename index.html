<!doctype html>
<html lang="de" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>CS2Freitag</title>
    <meta name="description" content="Moderne PWA für CS2 Callouts aller offiziellen Karten mit interaktiver Taktik-Karte, Offline-Funktion, Suche und Favoriten." />
    <meta property="og:title" content="CS2Freitag" />
    <meta property="og:description" content="Moderne PWA für CS2 Callouts aller offiziellen Karten mit interaktiver Taktik-Karte, Offline-Funktion, Suche und Favoriten." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#09090b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CS2Freitag" />
    <meta name="application-name" content="CS2Freitag" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="HandheldFriendly" content="true" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./pwa-512x512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./pwa-192x192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon.png" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="manifest" href="/manifest.json" />
    <script>
      // Ensure trailing slash on GitHub Pages subpaths so relative ./ assets resolve correctly
      if (window.location.pathname.length > 1 && !window.location.pathname.endsWith('/') && !window.location.pathname.includes('.')) {
        window.location.replace(window.location.pathname + '/' + window.location.search + window.location.hash);
      }
      window.__PWA_PROMPT__ = null;
      window.addEventListener('beforeinstallprompt', function(e) {
        e.preventDefault();
        window.__PWA_PROMPT__ = e;
        window.dispatchEvent(new Event('pwa-prompt-available'));
      });
      window.addEventListener('appinstalled', function() {
        window.__PWA_INSTALLED__ = true;
        window.dispatchEvent(new Event('pwa-app-installed'));
      });
      // Force path migration in localStorage
      try {
        const raw = localStorage.getItem('cs2freitag_maps_v3');
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.some(m => m.image && m.image.startsWith('/'))) {
             const migrated = parsed.map(m => ({
               ...m,
               image: m.image.startsWith('/') ? m.image.substring(1) : m.image,
               lowerImage: m.lowerImage && m.lowerImage.startsWith('/') ? m.lowerImage.substring(1) : m.lowerImage
             }));
             localStorage.setItem('cs2freitag_maps_v3', JSON.stringify(migrated));
             window.location.reload();
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased selection:bg-zinc-200 selection:text-zinc-900 min-h-screen">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
